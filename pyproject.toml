[project]
name = "lovi-bot"
version = "0.1.0"
description = "ЛОВИ — Telegram media downloader with a Redis queue"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiogram[proxy]>=3.22,<4",
  "arq>=0.26.3,<0.27",
  "pydantic-settings>=2.11,<3",
  "yt-dlp[default]>=2025.11.12,<2028",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "fakeredis[lua]>=2.32,<3",
  "ruff>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lovi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
